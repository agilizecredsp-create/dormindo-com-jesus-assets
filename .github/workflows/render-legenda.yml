name: Render Video com Legenda Karaoke
on:
  repository_dispatch:
    types: [render-video-legenda]
jobs:
  render:
    runs-on: ubuntu-latest
    # 90min nao era suficiente mesmo apos o fix de lotes no script (18/08/2026):
    # o job foi cancelado pelo proprio timeout as 95min, ainda dentro do passo
    # de renderizacao. Repo publico = sem custo extra de minutos do Actions,
    # entao so aumentar a folga em vez de tentar acelerar o render.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar FFmpeg
        # timeout curto + retry: essa etapa e trivial (normalmente ~20s) mas
        # travou por horas em runners do GitHub Actions em pelo menos 2
        # execucoes (18-19/08/2026), sem erro nenhum, so parada. Sem
        # timeout-minutes aqui, uma trava desse tipo consumia o orcamento
        # inteiro do job (180min) antes de qualquer coisa util rodar. Agora
        # falha rapido (5min) e tenta de novo antes de desistir de vez.
        timeout-minutes: 5
        run: |
          for tentativa in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y ffmpeg; then
              exit 0
            fi
            echo "Tentativa $tentativa de instalar o FFmpeg falhou, tentando de novo..."
            sleep 5
          done
          echo "ERRO: nao foi possivel instalar o FFmpeg apos 3 tentativas."
          exit 1
      - name: Rodar script de renderização com legenda
        env:
          AUDIO_URLS_JSON: ${{ toJson(github.event.client_payload.audioUrls) }}
          IMAGE_URLS_JSON: ${{ toJson(github.event.client_payload.imageUrls) }}
          DURACAO_ALVO_SEG: ${{ github.event.client_payload.duracaoAlvoSegundos }}
        run: |
          chmod +x render_video_com_legenda.sh
          ./render_video_com_legenda.sh
      - name: Publicar vídeo como Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="video-${{ github.event.client_payload.correlationId }}"
          gh release create "$TAG" \
            render_work/video_final.mp4 \
            render_work/short_1.mp4 \
            render_work/short_2.mp4 \
            render_work/thumbnail.jpg \
            --title "$TAG" \
            --notes "Render automático via N8N (com legenda karaoke) - ${{ github.event.client_payload.correlationId }}"
