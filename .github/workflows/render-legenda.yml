name: Render Video com Legenda Karaoke
on:
  repository_dispatch:
    types: [render-video-legenda]
jobs:
  render:
    runs-on: ubuntu-latest
    # 90min nao era suficiente mesmo apos o fix de lotes no script (18/08/2026):
    # o job foi cancelado pelo proprio timeout as 95min, ainda dentro do passo
    # de renderizacao. Repo publico = sem custo extra de minutos do Actions,
    # entao so aumentar a folga em vez de tentar acelerar o render.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar FFmpeg
        timeout-minutes: 5
        run: |
          curl -sL --fail --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          if [ ! -s /tmp/ffmpeg.tar.xz ]; then
            echo "ERRO: download do ffmpeg falhou ou veio vazio"
            exit 1
          fi
          mkdir -p /tmp/ffmpeg-extract
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract --strip-components=1
          sudo mv /tmp/ffmpeg-extract/bin/ffmpeg /usr/local/bin/ffmpeg
          sudo mv /tmp/ffmpeg-extract/bin/ffprobe /usr/local/bin/ffprobe
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          ffmpeg -version
      - name: Rodar script de renderização com legenda
        env:
          AUDIO_URLS_JSON: ${{ toJson(github.event.client_payload.audioUrls) }}
          IMAGE_URLS_JSON: ${{ toJson(github.event.client_payload.imageUrls) }}
          DURACAO_ALVO_SEG: ${{ github.event.client_payload.duracaoAlvoSegundos }}
          AFIRMACOES_JSON: ${{ toJson(github.event.client_payload.afirmacoes) }}
          NARRACAO_URL: ${{ github.event.client_payload.narracaoUrl }}
          MODO_AFIRMACAO: ${{ github.event.client_payload.modoAfirmacao }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x render_video_com_legenda.sh
          ./render_video_com_legenda.sh
      - name: Publicar vídeo como Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="video-${{ github.event.client_payload.correlationId }}"
          gh release create "$TAG" \
            render_work/video_final.mp4 \
            render_work/short_1.mp4 \
            render_work/short_2.mp4 \
            render_work/thumbnail.jpg \
            --title "$TAG" \
            --notes "Render automático via N8N (com legenda karaoke) - ${{ github.event.client_payload.correlationId }}"
